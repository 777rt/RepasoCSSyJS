<!-- Placeholder de imagen estilo boceto: caja blanca con borde negro y una "X" gris. -->
<!-- Se usa dentro de cada tarjeta de la galería para simular una foto pendiente. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 89" preserveAspectRatio="none">
  <!-- Fondo blanco de la caja: cubre todo el área de la imagen. -->
  <rect x="0" y="0" width="100" height="89" fill="#ffffff" />
  <!-- Borde exterior oscuro de la caja (grosor proporcional al boceto). -->
  <rect x="2" y="2" width="96" height="85" fill="none" stroke="#222222" stroke-width="4" />
  <!-- Diagonal de arriba-izquierda a abajo-derecha de la "X". -->
  <line x1="4" y1="4" x2="96" y2="85" stroke="#666666" stroke-width="2.5" />
  <!-- Diagonal de arriba-derecha a abajo-izquierda de la "X". -->
  <line x1="96" y1="4" x2="4" y2="85" stroke="#666666" stroke-width="2.5" />
</svg>
